      function encodeSvg(innerSvg, bg1, bg2) {
        const fullSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient>
          <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M 22 0 L 0 0 0 22" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/></pattern></defs>
          <rect width="440" height="200" fill="url(#bg)"/><rect width="440" height="200" fill="url(#grid)"/>${innerSvg}</svg>`;
        return `data:image/svg+xml;utf8,${encodeURIComponent(fullSvg)}`;
      }

      const MATERI_DATA = [
        // MATEMATIKA
        { id: 'mat-1', kategori: 'Matematika', diff: 'beginner', imageUrl: IMG.parabola, judul: { id: 'Persamaan & Fungsi Kuadrat', en: 'Quadratic Equations & Functions' }, deskripsi: { id: 'Menentukan diskriminan, sumbu simetri, serta titik puncak kurva parabola.', en: 'Determine the discriminant, axis of symmetry, and vertex of a parabola.' }, konten: { id: "Bentuk umum fungsi kuadrat adalah <strong>f(x) = ax² + bx + c</strong> (a ≠ 0). Nilai diskriminan <strong>D = b² - 4ac</strong> menentukan jenis akar real.<div class='formula-highlight'>Sumbu Simetri: x = -b / (2a) &nbsp;|&nbsp; Titik Puncak: (-b/2a, -D/4a)</div>", en: "The standard quadratic form is <strong>f(x) = ax² + bx + c</strong> (a ≠ 0). The discriminant <strong>D = b² - 4ac</strong> determines the nature of real roots.<div class='formula-highlight'>Axis of Symmetry: x = -b / (2a) &nbsp;|&nbsp; Vertex: (-b/2a, -D/4a)</div>" } },
        { id: 'mat-2', kategori: 'Matematika', diff: 'beginner', imageUrl: IMG.pythagoras, judul: { id: 'Teorema Pythagoras & Segitiga Siku-Siku', en: 'Pythagorean Theorem & Right Triangles' }, deskripsi: { id: 'Hubungan kuadrat sisi miring (hipotenusa) dengan kedua sisi penyikunya.', en: 'Relationship between the hypotenuse and the two perpendicular legs.' }, konten: { id: "Pada segitiga siku-siku, kuadrat panjang sisi miring (<em>c</em>) sama dengan jumlah kuadrat sisi penyikunya (<em>a</em> dan <em>b</em>).<div class='formula-highlight'>c² = a² + b² &nbsp;⟺&nbsp; c = √(a² + b²)</div>", en: "In any right triangle, the square of the hypotenuse (<em>c</em>) equals the sum of the squares of the other two sides (<em>a</em> and <em>b</em>).<div class='formula-highlight'>c² = a² + b² &nbsp;⟺&nbsp; c = √(a² + b²)</div>" } },
        { id: 'mat-3', kategori: 'Matematika', diff: 'intermediate', imageUrl: IMG.peluang, judul: { id: 'Statistika & Peluang Kejadian', en: 'Statistics & Event Probability' }, deskripsi: { id: 'Menghitung mean, median, serta rasio peluang kejadian terhadap ruang sampel.', en: 'Calculate mean, median, and the probability ratio over sample space.' }, konten: { id: "Peluang kejadian A dirumuskan <strong>P(A) = n(A) / n(S)</strong> dengan nilai 0 ≤ P(A) ≤ 1. Frekuensi harapan untuk N percobaan adalah <em>Fh = N × P(A)</em>.<div class='formula-highlight'>P(A) = n(A) / n(S) &nbsp;|&nbsp; Mean: x̄ = (∑ xᵢ) / n</div>", en: "The probability of event A is <strong>P(A) = n(A) / n(S)</strong> where 0 ≤ P(A) ≤ 1. Expected frequency for N trials is <em>E = N × P(A)</em>.<div class='formula-highlight'>P(A) = n(A) / n(S) &nbsp;|&nbsp; Mean: x̄ = (∑ xᵢ) / n</div>" } },
        // FISIKA
        { id: 'fis-1', kategori: 'Fisika', diff: 'beginner', imageUrl: IMG.projectile, judul: { id: 'Kinematika & Gerak Parabola', en: 'Kinematics & Projectile Motion' }, deskripsi: { id: 'Menganalisis lintasan peluru hasil perpaduan gerak lurus beraturan dan berubah beraturan.', en: 'Analyze projectile trajectories combining uniform horizontal and accelerated vertical motion.' }, konten: { id: "Gerak parabola memadukan gerak horizontal berkecepatan konstan (<em>vₓ = v₀ cos θ</em>) dan gerak vertikal dipengaruhi gravitasi <em>g</em>.<div class='formula-highlight'>H_maks = (v₀² sin²θ) / (2g) &nbsp;|&nbsp; Jarak R = (v₀² sin 2θ) / g</div>", en: "Projectile motion combines constant horizontal velocity (<em>vₓ = v₀ cos θ</em>) with vertical motion under gravity <em>g</em>.<div class='formula-highlight'>Max Height H = (v₀² sin²θ) / (2g) &nbsp;|&nbsp; Range R = (v₀² sin 2θ) / g</div>" } },
        { id: 'fis-2', kategori: 'Fisika', diff: 'beginner', imageUrl: IMG.newton, judul: { id: 'Hukum Newton tentang Gerak & Gaya', en: "Newton's Laws of Motion & Force" }, deskripsi: { id: 'Memahami inersia, percepatan akibat resultan gaya, serta pasangan gaya aksi-reaksi.', en: 'Understand inertia, acceleration from net force, and action-reaction pairs.' }, konten: { id: "<strong>Hukum II Newton</strong> menyatakan percepatan benda berbanding lurus dengan resultan gaya dan berbanding terbalik dengan massanya.<div class='formula-highlight'>∑F = m · a &nbsp;|&nbsp; Gaya Berat: W = m · g</div>", en: "<strong>Newton's Second Law</strong> states that acceleration is directly proportional to net force and inversely proportional to mass.<div class='formula-highlight'>∑F = m · a &nbsp;|&nbsp; Weight: W = m · g</div>" } },
        { id: 'fis-3', kategori: 'Fisika', diff: 'intermediate', imageUrl: IMG.ohm, judul: { id: 'Listrik Dinamis & Hukum Ohm', en: "Electric Circuits & Ohm's Law" }, deskripsi: { id: 'Hubungan tegangan, arus listrik, hambatan, serta daya pada rangkaian seri dan paralel.', en: 'Relationship between voltage, current, resistance, and power in circuits.' }, konten: { id: "Menurut <strong>Hukum Ohm</strong>, kuat arus <em>I</em> pada penghantar sebanding dengan tegangan <em>V</em> dan berbanding terbalik dengan hambatan <em>R</em>.<div class='formula-highlight'>V = I · R &nbsp;|&nbsp; Daya Listrik: P = V · I = I² · R</div>", en: "According to <strong>Ohm's Law</strong>, electric current <em>I</em> is directly proportional to voltage <em>V</em> and inversely proportional to resistance <em>R</em>.<div class='formula-highlight'>V = I · R &nbsp;|&nbsp; Electric Power: P = V · I = I² · R</div>" } },
        // KIMIA
        { id: 'kim-1', kategori: 'Kimia', diff: 'beginner', imageUrl: IMG.atom, judul: { id: 'Struktur Atom & Partikel Penyusun', en: 'Atomic Structure & Subatomic Particles' }, deskripsi: { id: 'Mengenal proton, neutron, elektron, nomor atom (Z), dan nomor massa (A).', en: 'Explore protons, neutrons, electrons, atomic number (Z), and mass number (A).' }, konten: { id: "Inti atom tersusun atas <strong>proton (+)</strong> dan <strong>neutron (netral)</strong>, sedangkan <strong>elektron (-)</strong> mengelilingi inti. Nomor atom Z = jumlah proton.<div class='formula-highlight'>Nomor Massa (A) = Proton (Z) + Neutron (N)</div>", en: "The nucleus contains <strong>protons (+)</strong> and <strong>neutrons (neutral)</strong>, while <strong>electrons (-)</strong> orbit it. Atomic number Z = number of protons.<div class='formula-highlight'>Mass Number (A) = Protons (Z) + Neutrons (N)</div>" } },
        { id: 'kim-2', kategori: 'Kimia', diff: 'intermediate', imageUrl: IMG.mol, judul: { id: 'Stoikiometri & Konsep Mol', en: 'Stoichiometry & The Mole Concept' }, deskripsi: { id: 'Menghitung jumlah mol zat dari massa, massa molar (Mr), dan bilangan Avogadro.', en: 'Calculate moles from mass, molar mass (Mr), and Avogadro’s number.' }, konten: { id: "<strong>1 mol</strong> zat mengandung 6,02 × 10²³ partikel (Bilangan Avogadro). Hubungan massa dan mol dinyatakan melalui massa molar <em>Mr</em>.<div class='formula-highlight'>n = massa (g) / Mr &nbsp;|&nbsp; Jumlah Partikel = n × 6,02×10²³</div>", en: "<strong>1 mole</strong> of substance contains 6.02 × 10²³ particles (Avogadro’s number). Mass and moles relate through molar mass <em>Mr</em>.<div class='formula-highlight'>n = mass (g) / Mr &nbsp;|&nbsp; Particles = n × 6.02×10²³</div>" } },
        { id: 'kim-3', kategori: 'Kimia', diff: 'advanced', imageUrl: IMG.ph, judul: { id: 'Larutan Asam, Basa & Skala pH', en: 'Acids, Bases & The pH Scale' }, deskripsi: { id: 'Mengukur tingkat keasaman larutan berdasarkan konsentrasi ion H⁺ dan OH⁻.', en: 'Measure solution acidity based on H⁺ and OH⁻ ion concentrations.' }, konten: { id: "Pada suhu 25°C, larutan dengan <strong>pH &lt; 7 bersifat asam</strong>, <strong>pH = 7 netral</strong>, dan <strong>pH &gt; 7 bersifat basa</strong>.<div class='formula-highlight'>pH = -log [H⁺] &nbsp;|&nbsp; pH + pOH = 14</div>", en: "At 25°C, solutions with <strong>pH &lt; 7 are acidic</strong>, <strong>pH = 7 neutral</strong>, and <strong>pH &gt; 7 basic (alkaline)</strong>.<div class='formula-highlight'>pH = -log [H⁺] &nbsp;|&nbsp; pH + pOH = 14</div>" } },
        // BIOLOGI
        { id: 'bio-1', kategori: 'Biologi', diff: 'beginner', imageUrl: IMG.cell, judul: { id: 'Struktur Sel & Fungsi Organel', en: 'Cell Structure & Organelle Functions' }, deskripsi: { id: 'Peran nukleus, mitokondria, ribosom, dan perbedaan sel hewan vs tumbuhan.', en: 'Roles of nucleus, mitochondria, ribosomes, and animal vs. plant cells.' }, konten: { id: "<strong>Mitokondria</strong> berperan sebagai penghasil energi (ATP), <strong>ribosom</strong> menyintesis protein, dan sel tumbuhan memiliki <strong>dinding sel serta kloroplas</strong>.<div class='formula-highlight'>Prokariotik: Tanpa membran inti &nbsp;|&nbsp; Eukariotik: Bermembran inti</div>", en: "<strong>Mitochondria</strong> generate cellular energy (ATP), <strong>ribosomes</strong> synthesize proteins, and plant cells possess a <strong>cell wall and chloroplasts</strong>.<div class='formula-highlight'>Prokaryote: No nuclear membrane &nbsp;|&nbsp; Eukaryote: True nucleus</div>" } },
        { id: 'bio-2', kategori: 'Biologi', diff: 'intermediate', imageUrl: IMG.photosynthesis, judul: { id: 'Fotosintesis & Metabolisme Energi', en: 'Photosynthesis & Energy Metabolism' }, deskripsi: { id: 'Proses konversi energi cahaya matahari menjadi glukosa dan oksigen di kloroplas.', en: 'Conversion of sunlight energy into glucose and oxygen inside chloroplasts.' }, konten: { id: "Fotosintesis berlangsung di <strong>kloroplas</strong> dengan bantuan klorofil. Reaksi terang menghasilkan ATP &amp; NADPH, sedangkan Siklus Calvin membentuk glukosa.<div class='formula-highlight'>6CO₂ + 6H₂O + Cahaya → C₆H₁₂O₆ + 6O₂</div>", en: "Photosynthesis occurs in <strong>chloroplasts</strong> using chlorophyll. Light reactions produce ATP &amp; NADPH, while the Calvin Cycle synthesizes glucose.<div class='formula-highlight'>6CO₂ + 6H₂O + Light → C₆H₁₂O₆ + 6O₂</div>" } },
        { id: 'bio-3', kategori: 'Biologi', diff: 'advanced', imageUrl: IMG.genetics, judul: { id: 'Genetika Dasar & Hukum Mendel', en: "Basic Genetics & Mendel's Laws" }, deskripsi: { id: 'Pewarisan sifat dominan-resesif melalui persilangan monohibrid dan diagram Punnett.', en: 'Inheritance of dominant-recessive traits via monohybrid crosses and Punnett squares.' }, konten: { id: "Persilangan dua individu heterozigot (<strong>Aa × Aa</strong>) menghasilkan rasio genotipe <strong>1 AA : 2 Aa : 1 aa</strong> dan rasio fenotipe dominan-resesif <strong>3 : 1</strong>.<div class='formula-highlight'>Genotipe: Susunan Alel &nbsp;|&nbsp; Fenotipe: Sifat yang Tampak</div>", en: "Crossing two heterozygotes (<strong>Aa × Aa</strong>) yields a genotype ratio of <strong>1 AA : 2 Aa : 1 aa</strong> and a dominant-to-recessive phenotype ratio of <strong>3 : 1</strong>.<div class='formula-highlight'>Genotype: Allele Makeup &nbsp;|&nbsp; Phenotype: Observable Trait</div>" } },
        // INFORMATIKA
        { id: 'inf-1', kategori: 'Informatika', diff: 'beginner', imageUrl: IMG.binary, judul: { id: 'Sistem Bilangan Biner & Gerbang Logika', en: 'Binary Numbers & Logic Gates' }, deskripsi: { id: 'Konversi desimal ke biner (basis 2) serta operasi logika AND, OR, dan NOT.', en: 'Convert decimal to binary (base 2) and evaluate AND, OR, and NOT gates.' }, konten: { id: "Komputer merepresentasikan data dengan digit <strong>0 dan 1 (bit)</strong>. Gerbang <strong>AND</strong> bernilai 1 hanya jika semua input 1, sedangkan <strong>OR</strong> bernilai 1 jika minimal satu input 1.<div class='formula-highlight'>1 Byte = 8 Bit &nbsp;|&nbsp; 1010₂ = (1×8) + (0×4) + (1×2) + (0×1) = 10₁₀</div>", en: "Computers represent data using <strong>0 and 1 (bits)</strong>. An <strong>AND</strong> gate outputs 1 only when all inputs are 1, while <strong>OR</strong> outputs 1 if at least one input is 1.<div class='formula-highlight'>1 Byte = 8 Bits &nbsp;|&nbsp; 1010₂ = (1×8) + (0×4) + (1×2) + (0×1) = 10₁₀</div>" } },
        { id: 'inf-2', kategori: 'Informatika', diff: 'intermediate', imageUrl: IMG.algorithm, judul: { id: 'Algoritma Pencarian & Kompleksitas Big-O', en: 'Search Algorithms & Big-O Complexity' }, deskripsi: { id: 'Membandingkan efisiensi Linear Search O(n) dengan Binary Search O(log n).', en: 'Compare the efficiency of Linear Search O(n) versus Binary Search O(log n).' }, konten: { id: "<strong>Binary Search</strong> membagi ruang pencarian terurut menjadi dua bagian di setiap langkah, sehingga jauh lebih cepat untuk data berukuran besar dibanding pengecekan satu per satu.<div class='formula-highlight'>Linear Search: O(n) &nbsp;|&nbsp; Binary Search (terurut): O(log n)</div>", en: "<strong>Binary Search</strong> halves a sorted search space at every step, making it vastly faster on large datasets than sequential scanning.<div class='formula-highlight'>Linear Search: O(n) &nbsp;|&nbsp; Binary Search (sorted): O(log n)</div>" } },
        { id: 'inf-3', kategori: 'Informatika', diff: 'advanced', imageUrl: IMG.datastruct, judul: { id: 'Struktur Data: Stack & Queue', en: 'Data Structures: Stack & Queue' }, deskripsi: { id: 'Prinsip kerja LIFO (Last-In First-Out) pada Stack dan FIFO (First-In First-Out) pada Queue.', en: 'LIFO (Last-In First-Out) in Stacks and FIFO (First-In First-Out) in Queues.' }, konten: { id: "<strong>Stack (Tumpukan)</strong> mengeluarkan elemen yang paling terakhir masuk (<em>LIFO</em>, contoh: tombol Undo). <strong>Queue (Antrean)</strong> memproses elemen yang pertama masuk (<em>FIFO</em>, contoh: antrean printer).<div class='formula-highlight'>Stack: Push / Pop (LIFO) &nbsp;|&nbsp; Queue: Enqueue / Dequeue (FIFO)</div>", en: "A <strong>Stack</strong> removes the most recently added item (<em>LIFO</em>, e.g., Undo history). A <strong>Queue</strong> processes the earliest item first (<em>FIFO</em>, e.g., print spooler).<div class='formula-highlight'>Stack: Push / Pop (LIFO) &nbsp;|&nbsp; Queue: Enqueue / Dequeue (FIFO)</div>" } },
        // ASTRONOMI
        { id: 'ast-1', kategori: 'Astronomi', diff: 'beginner', imageUrl: IMG.kepler, judul: { id: 'Tata Surya & Hukum Orbit Kepler', en: "The Solar System & Kepler's Laws" }, deskripsi: { id: 'Memahami lintasan elips planet, satuan astronomi (AU), dan periode revolusi.', en: 'Understand elliptical planetary orbits, Astronomical Units (AU), and orbital periods.' }, konten: { id: "Menurut <strong>Hukum I Kepler</strong>, setiap planet mengorbit Matahari dalam lintasan berbentuk <strong>elips</strong>. Jarak rata-rata Bumi–Matahari didefinisikan sebagai <strong>1 AU</strong> (~150 juta km).<div class='formula-highlight'>Hukum III Kepler: T² = a³ (T dalam tahun, a dalam AU)</div>", en: "According to <strong>Kepler's 1st Law</strong>, planets orbit the Sun along <strong>elliptical</strong> paths. The average Earth–Sun distance is defined as <strong>1 AU</strong> (~150 million km).<div class='formula-highlight'>Kepler's 3rd Law: T² = a³ (T in years, a in AU)</div>" } },
        { id: 'ast-2', kategori: 'Astronomi', diff: 'intermediate', imageUrl: IMG.stars, judul: { id: 'Siklus Hidup Bintang & Lubang Hitam', en: 'Stellar Life Cycle & Black Holes' }, deskripsi: { id: 'Evolusi bintang dari nebula, deret utama, raksasa merah hingga supernova.', en: 'Evolution of stars from nebulae and main sequence to supernovae and black holes.' }, konten: { id: "Bintang menghasilkan energi melalui <strong>fusi nuklir hidrogen menjadi helium</strong> di intinya. Bintang bermassa sangat besar mengakhiri hidupnya dalam ledakan <strong>Supernova</strong>.<div class='formula-highlight'>Bintang Massa Kecil → Katai Putih &nbsp;|&nbsp; Massa Masif → Bintang Neutron / Black Hole</div>", en: "Stars generate energy via <strong>nuclear fusion of hydrogen into helium</strong> in their cores. Massive stars end their lives in a dramatic <strong>Supernova</strong> explosion.<div class='formula-highlight'>Low-Mass Star → White Dwarf &nbsp;|&nbsp; Massive Star → Neutron Star / Black Hole</div>" } },
        { id: 'ast-3', kategori: 'Astronomi', diff: 'beginner', imageUrl: IMG.eclipse, judul: { id: 'Fase Bulan & Fenomena Gerhana', en: 'Lunar Phases & Eclipses' }, deskripsi: { id: 'Membedakan posisi Matahari-Bumi-Bulan saat gerhana matahari dan gerhana bulan.', en: 'Distinguish Sun-Earth-Moon alignments during solar and lunar eclipses.' }, konten: { id: "<strong>Gerhana Matahari</strong> terjadi saat Bulan berada di antara Matahari dan Bumi (fase Bulan Baru). <strong>Gerhana Bulan</strong> terjadi saat Bumi berada di antara Matahari dan Bulan (fase Purnama).<div class='formula-highlight'>Umbra: Bayangan Inti Gelap &nbsp;|&nbsp; Penumbra: Bayangan Kabur</div>", en: "A <strong>Solar Eclipse</strong> occurs when the Moon passes between the Sun and Earth (New Moon). A <strong>Lunar Eclipse</strong> occurs when Earth lies between the Sun and Moon (Full Moon).<div class='formula-highlight'>Umbra: Dark Core Shadow &nbsp;|&nbsp; Penumbra: Partial Outer Shadow</div>" } },
        // EKONOMI
        { id: 'eko-1', kategori: 'Ekonomi', diff: 'beginner', imageUrl: IMG.market, judul: { id: 'Permintaan, Penawaran & Keseimbangan Pasar', en: 'Supply, Demand & Market Equilibrium' }, deskripsi: { id: 'Menganalisis hukum permintaan-penawaran serta terbentuknya harga keseimbangan.', en: 'Analyze laws of demand & supply and how market equilibrium prices form.' }, konten: { id: "<strong>Hukum Permintaan</strong>: jika harga naik, jumlah barang diminta turun (<em>ceteris paribus</em>). <strong>Keseimbangan pasar</strong> terjadi saat jumlah permintaan sama dengan penawaran (<em>Qd = Qs</em>).<div class='formula-highlight'>Keseimbangan: Qd = Qs &nbsp;⟹&nbsp; Harga (P*) &amp; Kuantitas (Q*)</div>", en: "<strong>Law of Demand</strong>: as price rises, quantity demanded falls (<em>ceteris paribus</em>). <strong>Market equilibrium</strong> occurs where quantity demanded equals quantity supplied (<em>Qd = Qs</em>).<div class='formula-highlight'>Equilibrium: Qd = Qs &nbsp;⟹&nbsp; Price (P*) &amp; Quantity (Q*)</div>" } },
        { id: 'eko-2', kategori: 'Ekonomi', diff: 'intermediate', imageUrl: IMG.inflation, judul: { id: 'Inflasi & Kebijakan Moneter', en: 'Inflation & Monetary Policy' }, deskripsi: { id: 'Dampak kenaikan harga umum terhadap daya beli serta peran suku bunga bank sentral.', en: 'Impact of rising price levels on purchasing power and central bank interest rates.' }, konten: { id: "<strong>Inflasi</strong> adalah kenaikan harga barang dan jasa secara umum dan terus-menerus yang menurunkan daya beli uang. Bank sentral mengendalikannya lewat <strong>suku bunga acuan</strong>.<div class='formula-highlight'>Laju Inflasi = [(IHK_t - IHK_t₋₁) / IHK_t₋₁] × 100%</div>", en: "<strong>Inflation</strong> is a sustained rise in the general price level, reducing purchasing power. Central banks manage it using <strong>policy interest rates</strong>.<div class='formula-highlight'>Inflation Rate = [(CPI_t - CPI_t₋₁) / CPI_t₋₁] × 100%</div>" } },
        { id: 'eko-3', kategori: 'Ekonomi', diff: 'advanced', imageUrl: IMG.compound, judul: { id: 'Literasi Keuangan & Bunga Majemuk', en: 'Financial Literacy & Compound Interest' }, deskripsi: { id: 'Memahami pertumbuhan nilai investasi eksponensial akibat bunga berbunga.', en: 'Understand exponential investment growth driven by compounding returns.' }, konten: { id: "Berbeda dengan bunga tunggal yang hanya dihitung dari pokok awal, <strong>bunga majemuk</strong> menghitung bunga atas pokok ditambah akumulasi bunga sebelumnya.<div class='formula-highlight'>A = P (1 + r/n)ⁿᵗ &nbsp;|&nbsp; Aturan 72: Tahun Berlipat Ganda ≈ 72 / (% bunga)</div>", en: "Unlike simple interest calculated only on principal, <strong>compound interest</strong> earns interest on both the principal and previously accumulated interest.<div class='formula-highlight'>A = P (1 + r/n)ⁿᵗ &nbsp;|&nbsp; Rule of 72: Years to Double ≈ 72 / (% rate)</div>" } },
        // GEOGRAFI
        { id: 'geo-1', kategori: 'Geografi', diff: 'beginner', imageUrl: IMG.tectonic, judul: { id: 'Lempeng Tektonik & Gempa Bumi', en: 'Plate Tectonics & Earthquakes' }, deskripsi: { id: 'Mengenal pergerakan lempeng konvergen, divergen, transform, serta zona subduksi.', en: 'Explore convergent, divergent, and transform plate boundaries and subduction zones.' }, konten: { id: "Kerak bumi terpecah menjadi beberapa <strong>lempeng tektonik</strong> yang bergerak di atas astenosfer. Pertemuan dua lempeng saling bertumbukan disebut batas <strong>konvergen</strong>.<div class='formula-highlight'>Hiposentrum: Pusat Gempa di Dalam Bumi &nbsp;|&nbsp; Episentrum: Titik di Permukaan</div>", en: "Earth's crust is divided into <strong>tectonic plates</strong> moving over the asthenosphere. Where two plates collide, a <strong>convergent</strong> boundary forms.<div class='formula-highlight'>Hypocenter: Underground Focus &nbsp;|&nbsp; Epicenter: Surface Point Above</div>" } },
        { id: 'geo-2', kategori: 'Geografi', diff: 'beginner', imageUrl: IMG.hydrology, judul: { id: 'Siklus Hidrologi & Dinamika Iklim', en: 'The Hydrological Cycle & Climate' }, deskripsi: { id: 'Tahapan evaporasi, transpirasi, kondensasi, presipitasi, hingga infiltrasi air tanah.', en: 'Stages of evaporation, transpiration, condensation, precipitation, and infiltration.' }, konten: { id: "<strong>Siklus air</strong> digerakkan oleh energi panas matahari. Uap air naik lalu mengalami pendinginan menjadi awan (<strong>kondensasi</strong>) dan jatuh sebagai hujan (<strong>presipitasi</strong>).<div class='formula-highlight'>Evaporasi (Laut/Sungai) → Kondensasi (Awan) → Presipitasi (Hujan)</div>", en: "The <strong>water cycle</strong> is powered by solar heat. Water vapor rises, cools into clouds (<strong>condensation</strong>), and falls back as rain or snow (<strong>precipitation</strong>).<div class='formula-highlight'>Evaporation → Condensation (Clouds) → Precipitation (Rain)</div>" } },
        { id: 'geo-3', kategori: 'Geografi', diff: 'intermediate', imageUrl: IMG.cartography, judul: { id: 'Kartografi: Skala Peta & Koordinat', en: 'Cartography: Map Scale & Coordinates' }, deskripsi: { id: 'Menghitung jarak sebenarnya dari skala peta serta membaca garis lintang dan bujur.', en: 'Calculate real-world distances from map scales and read latitude & longitude.' }, konten: { id: "<strong>Skala peta</strong> menyatakan perbandingan jarak pada peta dengan jarak sebenarnya di permukaan bumi. Garis <strong>khatulistiwa</strong> merupakan garis lintang 0°.<div class='formula-highlight'>Jarak Sebenarnya = Jarak di Peta × Penyebut Skala</div>", en: "<strong>Map scale</strong> expresses the ratio between a distance on a map and the corresponding ground distance. The <strong>Equator</strong> marks 0° latitude.<div class='formula-highlight'>Actual Distance = Map Distance × Scale Denominator</div>" } }

        return {
          lang: 'id',
          activePlayerId: 'player-1',

            { id: 'player-1', namaAlias: 'Euler_01 (Siswa A)', xp: 100, level: 1, totalPoin: 100, badge: ['badge-welcome'], materiSelesai: ['mat-1'], soalSelesai: ['q-mat-1', 'q-mat-2'], dailyChallengeClaimedDate: '' },

          ],

        };

      function sanitizePlayer(raw) {
        const xp = Number.isFinite(raw?.xp) ? Math.max(0, raw.xp) : 0;
        return {
          id: String(raw?.id || 'player-1'),
          namaAlias: String(raw?.namaAlias || 'Student'),
          xp,
          level: calculateLevel(xp),
          totalPoin: Number.isFinite(raw?.totalPoin) ? Math.max(0, raw.totalPoin) : xp,
          badge: Array.isArray(raw?.badge) ? [...new Set(raw.badge)] : ['badge-welcome'],
          materiSelesai: Array.isArray(raw?.materiSelesai) ? [...new Set(raw.materiSelesai)] : [],
          soalSelesai: Array.isArray(raw?.soalSelesai) ? [...new Set(raw.soalSelesai)] : [],
          dailyChallengeClaimedDate: typeof raw?.dailyChallengeClaimedDate === 'string' ? raw.dailyChallengeClaimedDate : ''
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createDefaultState();
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed?.players) || parsed.players.length === 0) return createDefaultState();
          const players = parsed.players.map(sanitizePlayer);
          const activeExists = players.some((p) => p.id === parsed.activePlayerId);
          return {
            lang: parsed.lang === 'en' ? 'en' : 'id',
            activePlayerId: activeExists ? parsed.activePlayerId : players[0].id,
            players,
            progresLog: Array.isArray(parsed.progresLog) ? parsed.progresLog : []
          };
        } catch {
          return createDefaultState();
        }
      }

      class LabStudyStore {
        constructor() {
          this.state = loadState();
          this.listeners = new Set();
          this.evaluateAchievements(this.getActivePlayer());
          this.persist();
        }
        subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
        notify() { this.listeners.forEach((fn) => fn(this.state)); }
        persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch {} }
        getState() { return this.state; }
        getLang() { return this.state.lang; }
        getActivePlayer() { return this.state.players.find((p) => p.id === this.state.activePlayerId) || this.state.players[0]; }
        setLanguage(lang) {
          if (lang !== 'id' && lang !== 'en') return;
          this.state.lang = lang;
          this.persist();
          this.notify();
        }
        evaluateAchievements(player) {
          const unlockedIds = [];
          const unlock = (id) => {
            if (!player.badge.includes(id)) {
              player.badge.push(id);
              unlockedIds.push(id);
            }
          };
          unlock('badge-welcome');
          if (player.materiSelesai.length >= 1) unlock('badge-first-materi');
          if (player.soalSelesai.length >= 10) unlock('badge-quiz-master');
          if (player.dailyChallengeClaimedDate !== '') unlock('badge-daily');
          if (player.level >= 3) unlock('badge-level-3');
          const allSubjectsCovered = SUBJECT_LIST.every((sub) =>
            player.materiSelesai.some((mId) => MATERI_DATA.find((item) => item.id === mId)?.kategori === sub.key)
          );
          if (allSubjectsCovered) unlock('badge-polymath');
          return unlockedIds;
        }
        awardPointsAndXP(player, points, xp) {
          const oldLevel = player.level;
          player.totalPoin += points;
          player.xp += xp;
          player.level = calculateLevel(player.xp);
          const unlockedIds = this.evaluateAchievements(player);
          this.persist();
          this.notify();
          return { leveledUp: player.level > oldLevel, newLevel: player.level, unlockedIds, xpAwarded: xp, pointsAwarded: points };
        }
        setActivePlayer(playerId) {
          if (!this.state.players.some((p) => p.id === playerId)) return;
          this.state.activePlayerId = playerId;
          this.evaluateAchievements(this.getActivePlayer());
          this.persist();
          this.notify();
        }
        completeDailyChallenge() {
          const player = this.getActivePlayer();
          const todayStr = getLocalDateString();
          if (player.dailyChallengeClaimedDate === todayStr) return null;
          player.dailyChallengeClaimedDate = todayStr;
          return this.awardPointsAndXP(player, 100, 100);
        }
        recordCorrectQuiz(materiId, quizId) {
          const player = this.getActivePlayer();
          const quiz = KUIS_DATA.find((q) => q.id === quizId);
          if (!quiz) return { alreadyEarned: true };
          const alreadyEarned = player.soalSelesai.includes(quizId);
          let reward = { leveledUp: false, unlockedIds: [], xpAwarded: 0, pointsAwarded: 0 };
          if (!alreadyEarned) {
            player.soalSelesai.push(quizId);
            reward = this.awardPointsAndXP(player, quiz.poin, quiz.poin);
          }
          const relatedQuizzes = KUIS_DATA.filter((q) => q.materiId === materiId);
          if (relatedQuizzes.every((q) => player.soalSelesai.includes(q.id)) && !player.materiSelesai.includes(materiId)) {
            player.materiSelesai.push(materiId);
            this.state.progresLog.push({ pemainId: player.id, materiId, skor: 100, status: 'selesai', tanggalPenyelesaian: new Date().toISOString() });
            reward.unlockedIds = [...new Set([...reward.unlockedIds, ...this.evaluateAchievements(player)])];
            this.persist();
            this.notify();
          }
          return { alreadyEarned, ...reward };
        }
        resetActivePlayer() {
          const player = this.getActivePlayer();
          player.xp = 0; player.level = 1; player.totalPoin = 0;
          player.badge = ['badge-welcome']; player.materiSelesai = [];
          player.soalSelesai = []; player.dailyChallengeClaimedDate = '';
          this.state.progresLog = this.state.progresLog.filter((log) => log.pemainId !== player.id);
          this.persist();
          this.notify();
        }
      }

      const store = new LabStudyStore();

      let confirmLastFocus = null, confirmResolve = null;
      function closeConfirm(res) {
        const modal = document.getElementById('confirmModal');
        modal.hidden = true;
        if (confirmLastFocus?.focus) confirmLastFocus.focus();
        if (confirmResolve) { const cb = confirmResolve; confirmResolve = null; cb(res); }
      }
      function initConfirmModal() {
        const modal = document.getElementById('confirmModal');
        document.getElementById('btnConfirmCancel').addEventListener('click', () => closeConfirm(false));
        document.getElementById('btnConfirmOk').addEventListener('click', () => closeConfirm(true));
        modal.addEventListener('click', (e) => { if (e.target === modal) closeConfirm(false); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closeConfirm(false); });
      }
      function openConfirmModal({ title, message }) {
        const t = I18N[store.getLang()].ach;
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmMessage').textContent = message;
        document.getElementById('btnConfirmCancel').textContent = t.cancel;
        document.getElementById('btnConfirmOk').textContent = t.ok;
        confirmLastFocus = document.activeElement;
        document.getElementById('confirmModal').hidden = false;
        document.getElementById('btnConfirmCancel').focus();
        return new Promise((resolve) => { confirmResolve = resolve; });
      }

      function setupHiDPICanvas(canvas, logicalW, logicalH) {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = logicalW * dpr;
        canvas.height = logicalH * dpr;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { ctx, width: logicalW, height: logicalH };
      }

      function createQuadraticSim() {
        const { ctx, width: w, height: h } = setupHiDPICanvas(document.getElementById('canvasQuadratic'), 600, 380);
        const rA = document.getElementById('rangeA'), rB = document.getElementById('rangeB'), rC = document.getElementById('rangeC');
        const vA = document.getElementById('valA'), vB = document.getElementById('valB'), vC = document.getElementById('valC');
        const info = document.getElementById('quadTelemetry');

        function draw() {
          const s = I18N[store.getLang()].sim;
          const a = parseFloat(rA.value), b = parseFloat(rB.value), c = parseFloat(rC.value);
          vA.textContent = a.toFixed(1); vB.textContent = b.toFixed(0); vC.textContent = c.toFixed(0);
          const cx = w / 2, cy = h / 2, scale = 24;
          ctx.clearRect(0, 0, w, h);

          ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)'; ctx.lineWidth = 1;
          for (let x = cx % scale; x < w; x += scale) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
          for (let y = cy % scale; y < h; y += scale) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

          ctx.strokeStyle = 'rgba(241, 245, 249, 0.45)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

          ctx.strokeStyle = '#818cf8'; ctx.lineWidth = 3; ctx.beginPath();
          let started = false;
          for (let px = 0; px <= w; px += 2) {
            const x = (px - cx) / scale, py = cy - (a * x * x + b * x + c) * scale;
            if (py >= -250 && py <= h + 250) {
              if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
            }
          }
          ctx.stroke();

          const signB = b >= 0 ? '+' : '', signC = c >= 0 ? '+' : '';
          if (a === 0) {
            info.innerHTML = `<strong class="math-font">f(x) = ${b}x ${signC}${c}</strong><br><span style="color:#fcd34d;">${s.quadLinearNote}</span>`;
            return;
          }

          const vx = -b / (2 * a), vy = a * vx * vx + b * vx + c, D = b * b - 4 * a * c;
          const symPx = cx + vx * scale, vPxY = cy - vy * scale;
          ctx.strokeStyle = 'rgba(245, 158, 11, 0.45)'; ctx.setLineDash([5, 5]);
          ctx.beginPath(); ctx.moveTo(symPx, 0); ctx.lineTo(symPx, h); ctx.stroke(); ctx.setLineDash([]);

          if (vPxY >= 0 && vPxY <= h) {
            ctx.beginPath(); ctx.arc(symPx, vPxY, 6, 0, Math.PI * 2); ctx.fillStyle = '#10b981'; ctx.fill();
            ctx.fillStyle = '#f8fafc'; ctx.font = '12px monospace';
            ctx.fillText(`${s.quadPeak}(${vx.toFixed(1)}, ${vy.toFixed(1)})`, symPx + 10, vPxY - 8);
          }
          info.innerHTML = `<strong class="math-font">f(x) = ${a}x² ${signB}${b}x ${signC}${c}</strong><br>${s.quadVertex}: <strong>(${vx.toFixed(2)}, ${vy.toFixed(2)})</strong> | ${s.quadDisc}: <strong>${D.toFixed(1)}</strong>`;
        }
        [rA, rB, rC].forEach((el) => el.addEventListener('input', draw));
        draw();
        return { redraw: draw };
      }

      // 2. Fisika Parabola
      function createPhysicsSim() {
        const { ctx, width: w, height: h } = setupHiDPICanvas(document.getElementById('canvasPhysics'), 600, 380);
        const rVel = document.getElementById('rangeVel'), rPitch = document.getElementById('rangePitch'), rGrav = document.getElementById('rangeGrav');
        const vVel = document.getElementById('valVel'), vPitch = document.getElementById('valPitch'), vGrav = document.getElementById('valGrav');
        const btnLaunch = document.getElementById('btnLaunchProj'), info = document.getElementById('physTelemetry');
        let playing = false, isVisible = false, simTime = 0, lastTs = 0, rafId = null;

        function getParams() {
          const v0 = parseFloat(rVel.value), deg = parseFloat(rPitch.value), g = parseFloat(rGrav.value);
          const rad = (deg * Math.PI) / 180, vx = v0 * Math.cos(rad), vy = v0 * Math.sin(rad);
          const totalT = (2 * vy) / g, maxH = (vy * vy) / (2 * g), range = vx * totalT;
          return { v0, deg, g, vx, vy, totalT, maxH, range };
        }
        function drawFrame() {
          const s = I18N[store.getLang()].sim, p = getParams();
          vVel.textContent = `${p.v0} m/s`; vPitch.textContent = `${p.deg}°`; vGrav.textContent = `${p.g.toFixed(1)} m/s²`;
          btnLaunch.textContent = playing ? s.physLaunching : s.physLaunch;
          ctx.clearRect(0, 0, w, h);
          const padL = 45, padB = 45, groundY = h - padB;
          const scale = Math.min((w - padL - 30) / Math.max(120, p.range * 1.12), (groundY - 30) / Math.max(60, p.maxH * 1.25));
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(padL - 15, groundY); ctx.lineTo(w - 15, groundY); ctx.stroke();

          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 4]); ctx.beginPath();
          for (let i = 0; i <= 80; i++) {
            const t = (i / 80) * p.totalT, px = padL + p.vx * t * scale, py = groundY - (p.vy * t - 0.5 * p.g * t * t) * scale;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke(); ctx.setLineDash([]);

          const peakX = padL + (p.range / 2) * scale, peakY = groundY - p.maxH * scale;
          ctx.strokeStyle = 'rgba(16, 185, 129, 0.45)'; ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(peakX, peakY); ctx.lineTo(peakX, groundY); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = '#6ee7b7'; ctx.font = '11px monospace'; ctx.fillText(`H=${p.maxH.toFixed(1)}m`, peakX + 6, peakY + 4);
          ctx.fillStyle = '#fcd34d'; ctx.fillText(`R=${p.range.toFixed(1)}m`, Math.min(w - 75, padL + p.range * scale - 24), groundY + 18);

          const curT = Math.min(simTime, p.totalT);
          const bx = padL + (p.vx * curT) * scale, by = groundY - Math.max(0, p.vy * curT - 0.5 * p.g * curT * curT) * scale;
          ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI * 2); ctx.fillStyle = '#f59e0b'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
          info.innerHTML = `${s.physMaxH}: <strong>${p.maxH.toFixed(1)} m</strong> | ${s.physRange}: <strong>${p.range.toFixed(1)} m</strong><br>${s.physTime}: <strong>${p.totalT.toFixed(2)} s</strong>`;
        }
        function tick(ts) {
          if (!playing || !isVisible) { rafId = null; return; }
          if (!lastTs) lastTs = ts;
          const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
          const { totalT } = getParams();
          simTime += dt * 1.4;
          if (simTime >= totalT) { simTime = totalT; playing = false; }
          drawFrame();
          if (playing) rafId = requestAnimationFrame(tick); else { rafId = null; lastTs = 0; }
        }
        function syncLoop() {
          if (playing && isVisible && !rafId) { lastTs = 0; rafId = requestAnimationFrame(tick); }
          else if ((!playing || !isVisible) && rafId) { cancelAnimationFrame(rafId); rafId = null; lastTs = 0; }
        }
        [rVel, rPitch, rGrav].forEach((el) => el.addEventListener('input', () => { simTime = 0; playing = false; syncLoop(); drawFrame(); }));
        btnLaunch.addEventListener('click', () => { const { totalT } = getParams(); if (!playing && simTime >= totalT) simTime = 0; playing = !playing; drawFrame(); syncLoop(); });
        drawFrame();
        return { redraw: drawFrame, setVisible(v) { isVisible = v; if (v) drawFrame(); syncLoop(); } };
      }

      // 3. Kimia Lab Skala pH
      function createChemSim() {

          const markerX = barX + (ph / 14) * (barW - stepW) + stepW / 2;
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.moveTo(markerX, 30); ctx.lineTo(markerX - 6, 18); ctx.lineTo(markerX + 6, 18); ctx.closePath(); ctx.fill();

          // Beaker
          const bx = 225, by = 120, bw = 150, bh = 195;
          ctx.fillStyle = liqColor;
          ctx.globalAlpha = 0.85;
          ctx.fillRect(bx + 4, by + 55, bw - 8, bh - 59);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by); ctx.stroke();

          ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';

          else if (ph > 7) cls = s.chemBaseWeak;

          const nearestEx = s.chemExamples[Math.round(ph)] || '';
          info.innerHTML = `${s.chemStatus}: <strong>${cls}</strong> | <span class="math-font">[H⁺] = 10⁻${ph} M</span>${nearestEx ? `<br>${s.chemExample}: <strong>${nearestEx}</strong>` : ''}`;

        rPh.addEventListener('input', draw);
        document.getElementById('chemPresets').addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-ph]');

          rPh.value = btn.dataset.ph;
          draw();

        draw();
        return { redraw: draw };
      }

        function drawFrame() {
          const s = I18N[store.getLang()].sim;

          vLight.textContent = `${light}%`; vCo2.textContent = `${co2}%`;

          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
          ctx.strokeRect(210, 95, 180, 220);

          // Aquatic plant
          ctx.strokeStyle = '#10b981'; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(300, 310); ctx.quadraticCurveTo(280, 250, 300, 200); ctx.stroke();
          ctx.fillStyle = '#34d399';
          [230, 255, 280].forEach((ly, idx) => {
            ctx.beginPath(); ctx.ellipse(idx % 2 === 0 ? 282 : 312, ly, 16, 7, idx % 2 === 0 ? -0.4 : 0.4, 0, Math.PI * 2); ctx.fill();
          });

          // Oxygen bubbles proportional to rate

        [rLight, rCo2].forEach((el) => el.addEventListener('input', drawFrame));

            if (v && !rafId) rafId = requestAnimationFrame(tick);

      // 5. Informatika Lab Gerbang Logika
      function createInfoSim() {
        const { ctx, width: w, height: h } = setupHiDPICanvas(document.getElementById('canvasInfo'), 600, 380);
        const btnA = document.getElementById('btnToggleA'), btnB = document.getElementById('btnToggleB');
        const gateSel = document.getElementById('gateSelector'), info = document.getElementById('infoTelemetry');
        let inA = 1, inB = 0, gate = 'AND';

        function evalGate() {
          if (gate === 'AND') return inA & inB;
          if (gate === 'OR') return inA | inB;
          if (gate === 'XOR') return inA ^ inB;
          return (inA & inB) ? 0 : 1;
        }

        function draw() {
          const s = I18N[store.getLang()].sim;
          const out = evalGate();
          btnA.textContent = `Input A: ${inA}`;
          btnB.textContent = `Input B: ${inB}`;
          ctx.clearRect(0, 0, w, h);

          // Wires
          ctx.lineWidth = 5;
          ctx.strokeStyle = inA ? '#10b981' : '#475569';
          ctx.beginPath(); ctx.moveTo(90, 140); ctx.lineTo(235, 140); ctx.stroke();

          ctx.strokeStyle = inB ? '#10b981' : '#475569';
          ctx.beginPath(); ctx.moveTo(90, 240); ctx.lineTo(235, 240); ctx.stroke();

          ctx.strokeStyle = out ? '#fde047' : '#475569';
          ctx.beginPath(); ctx.moveTo(355, 190); ctx.lineTo(485, 190); ctx.stroke();

          // Gate chip
          ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 3;
          ctx.fillRect(235, 110, 120, 160);
          ctx.strokeRect(235, 110, 120, 160);
          ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
          ctx.fillText(gate, 295, 198);

          // Input/Output nodes
          const drawNode = (x, y, val, lbl) => {
            ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2);
            ctx.fillStyle = val ? '#10b981' : '#334155'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 16px monospace'; ctx.fillText(String(val), x, y + 6);
            ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif'; ctx.fillText(lbl, x, y - 34);
          };
          drawNode(85, 140, inA, 'A');
          drawNode(85, 240, inB, 'B');
          drawNode(500, 190, out, 'OUT');
          ctx.textAlign = 'left';

          info.innerHTML = `${s.infoOut}: <strong>${gate}(${inA}, ${inB}) = ${out}</strong><br>${s.infoExplain[gate]}`;
        }

        btnA.addEventListener('click', () => { inA = inA ? 0 : 1; draw(); });
        btnB.addEventListener('click', () => { inB = inB ? 0 : 1; draw(); });
        gateSel.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-gate]');
          if (!btn) return;
          gate = btn.dataset.gate;
          gateSel.querySelectorAll('button').forEach((b) => { b.className = b === btn ? 'btn btn-emerald' : 'btn btn-outline'; });
          draw();
        });
        draw();
        return { redraw: draw };
      }

      // 7. Ekonomi Lab Pasar
      function createEkoSim() {
        const { ctx, width: w, height: h } = setupHiDPICanvas(document.getElementById('canvasEko'), 600, 380);
        const rDem = document.getElementById('rangeDemand'), rSup = document.getElementById('rangeSupply');
        const vDem = document.getElementById('valDemand'), vSup = document.getElementById('valSupply'), info = document.getElementById('ekoTelemetry');

        function draw() {
          const s = I18N[store.getLang()].sim;
          const dShift = parseFloat(rDem.value), sShift = parseFloat(rSup.value);
          vDem.textContent = dShift > 0 ? `+${dShift}` : String(dShift);
          vSup.textContent = sShift > 0 ? `+${sShift}` : String(sShift);

          ctx.clearRect(0, 0, w, h);
          const ox = 75, oy = h - 55, axisW = 440, axisH = 270;

          // Axes
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(ox, 40); ctx.lineTo(ox, oy); ctx.lineTo(ox + axisW, oy); ctx.stroke();
          ctx.fillStyle = '#cbd5e1'; ctx.font = '12px sans-serif';
          ctx.fillText(s.ekoPrice, ox - 48, 48);
          ctx.fillText(s.ekoQty, ox + axisW - 55, oy + 24);

          // Math model on 0..10 grid:
          // Demand: P = 10 + dShift - Q
          // Supply: P = 2 - sShift + Q
          const mapX = (q) => ox + (q / 12) * axisW;
          const mapY = (p) => oy - (p / 12) * axisH;

          // Draw Demand line
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.moveTo(mapX(1), mapY(9 + dShift)); ctx.lineTo(mapX(10), mapY(0 + dShift)); ctx.stroke();
          ctx.fillStyle = '#7dd3fc'; ctx.font = 'bold 13px sans-serif'; ctx.fillText('D', mapX(10.2), mapY(0 + dShift));

          // Draw Supply line
          ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.moveTo(mapX(1), mapY(3 - sShift)); ctx.lineTo(mapX(10), mapY(12 - sShift)); ctx.stroke();
          ctx.fillStyle = '#fcd34d'; ctx.fillText('S', mapX(10.2), mapY(12 - sShift));

          // Equilibrium: 10 + dShift - Q = 2 - sShift + Q  => 2Q = 8 + dShift + sShift
          const qEq = (8 + dShift + sShift) / 2;
          const pEq = 2 - sShift + qEq;
          const eqX = mapX(qEq), eqY = mapY(pEq);

          ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)'; ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(eqX, oy); ctx.lineTo(eqX, eqY); ctx.lineTo(ox, eqY); ctx.stroke(); ctx.setLineDash([]);
          ctx.beginPath(); ctx.arc(eqX, eqY, 7, 0, Math.PI * 2); ctx.fillStyle = '#10b981'; ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

          info.innerHTML = `${s.ekoEq}: <strong>Q* = ${qEq.toFixed(1)}</strong> | <strong>P* = ${pEq.toFixed(1)}</strong>`;
        }
        [rDem, rSup].forEach((el) => el.addEventListener('input', draw));
        draw();
        return { redraw: draw };
      }

        let counts = [0, 0, 0, 0, 0, 0], totalRolls = 0;

        function draw() {
          const s = I18N[store.getLang()].sim;
          ctx.clearRect(0, 0, w, h);
          const padLeft = 55, padBottom = 45, chartH = h - 85, chartW = w - 90, maxFreq = 0.4;
          const theoY = h - padBottom - (1 / 6 / maxFreq) * chartH;
          ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
          ctx.beginPath(); ctx.moveTo(padLeft, theoY); ctx.lineTo(w - 25, theoY); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = '#fcd34d'; ctx.font = '12px sans-serif'; ctx.fillText(s.diceTheo, padLeft + 8, theoY - 8);

          const barGap = chartW / 6, barW = barGap * 0.56;
          for (let i = 0; i < 6; i++) {
            const relFreq = totalRolls > 0 ? counts[i] / totalRolls : 0;
            const barH = Math.min(chartH, (relFreq / maxFreq) * chartH);
            const bx = padLeft + i * barGap + (barGap - barW) / 2, by = h - padBottom - barH;
            ctx.fillStyle = '#6366f1'; ctx.fillRect(bx, by, barW, barH);
            ctx.fillStyle = '#f1f5f9'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(s.diceLabel(i + 1), bx + barW / 2, h - 22);
            ctx.fillStyle = '#94a3b8'; ctx.font = '11px monospace'; ctx.fillText(totalRolls > 0 ? `${(relFreq * 100).toFixed(1)}%` : '0%', bx + barW / 2, by - 6);
          }
          ctx.textAlign = 'left';
          const maxDiff = totalRolls > 0 ? Math.max(...counts.map((c) => Math.abs(c / totalRolls - 1 / 6))) * 100 : 0;
          info.innerHTML = `${s.diceTotal}: <strong>${totalRolls} ${s.diceTimes}</strong> | ${s.diceMaxDiff}: <strong>${totalRolls > 0 ? `${maxDiff.toFixed(2)}%` : '-'}</strong>`;
        }
        function rollMany(n) { for (let i = 0; i < n; i++) { counts[Math.floor(Math.random() * 6)]++; totalRolls++; } draw(); }
        document.getElementById('btnRoll10').addEventListener('click', () => rollMany(10));
        document.getElementById('btnRoll100').addEventListener('click', () => rollMany(100));
        document.getElementById('btnRollReset').addEventListener('click', () => { counts = [0, 0, 0, 0, 0, 0]; totalRolls = 0; draw(); });
        draw();
        return { redraw: draw };
      }

          return;
        }
        const optBtn = e.target.closest('button[data-opt-idx]');
        if (!optBtn) return;
        const { materiId, quizId } = optBtn.dataset;
        const selectedIdx = Number(optBtn.dataset.optIdx);
        const quiz = KUIS_DATA.find((q) => q.id === quizId);
        if (!quiz) return;

        document.querySelectorAll(`#opts-${quizId} .quiz-option`).forEach((btn, idx) => {
          btn.disabled = true;
          if (idx === quiz.jawabanBenar) btn.classList.add('correct');
          else if (idx === selectedIdx) btn.classList.add('wrong');
        });

        const expEl = document.getElementById(`exp-${quizId}`);
        if (selectedIdx === quiz.jawabanBenar) {
          const result = store.recordCorrectQuiz(materiId, quizId);
          if (!result.alreadyEarned) {
            expEl.innerHTML = `<div class="explanation-box">✅ <strong>${t.modal.correctFirst(quiz.poin)}</strong><br>${escapeHtml(quiz.penjelasan[lang])}</div>`;
            const qBadge = document.getElementById(`qbadge-${quizId}`);
            if (qBadge) { qBadge.textContent = t.modal.claimed; qBadge.style.color = '#94a3b8'; }
            notifyReward(result, t.modal.quizToast);
          } else {
            expEl.innerHTML = `<div class="explanation-box">✅ <strong>${t.modal.correctRepeat}</strong><br>${escapeHtml(quiz.penjelasan[lang])}</div>`;
          }
        } else {
          expEl.innerHTML = `<div class="explanation-box is-error">❌ <strong>${t.modal.wrongAnswer}</strong><br>${escapeHtml(quiz.penjelasan[lang])}<br><button type="button" class="btn btn-outline btn-retry" data-materi-id="${escapeHtml(materiId)}" data-retry-quiz="${escapeHtml(quizId)}">${t.modal.retrySingle}</button></div>`;
        }
      });

      document.getElementById('btnResetProgress').addEventListener('click', async () => {
        const lang = store.getLang();
        const t = I18N[lang].ach;
        const player = store.getActivePlayer();
        const ok = await openConfirmModal({
          title: t.confirmTitle,
          message: t.confirmMsg(player.namaAlias)
        });
        if (!ok) return;
        store.resetActivePlayer();
        showToast(t.resetDone);
      });

      store.subscribe(renderAll);
      renderAll();
    })();
  </script>
</body>
</html>
